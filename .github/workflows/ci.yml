name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: biolife }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: ci-no-es-secreto
      DEBUG: "True"
      ALLOWED_HOSTS: ".localhost,127.0.0.1"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/biolife
      BASE_DOMAIN: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: "requirements/*.txt" }
      - run: pip install -r requirements/local.txt
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q
      - run: |
          python manage.py migrate_schemas --shared
          python scripts/check_tenant_isolation.py